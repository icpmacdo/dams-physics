<figure class="sheet wide g-fig" id="fig-column">
      <div class="sheet-top">
        <span class="figno"><b>Fig. 4.2</b> · Stresses in 10 m of sand as the water table rises</span>
        <span class="scale-note">Drawn to scale · 18 kN/m³ damp, 20 kN/m³ soaked</span>
      </div>
      <div class="g-split">
        <div class="g-draw"><svg class="dwg gd" id="svg-column" viewBox="0 0 480 380" role="img" aria-label="A ten metre column of sand with a water table, beside a chart of stress against depth. Total stress increases with depth. Pore pressure is zero above the water table and increases below it. Effective stress, the difference, grows more slowly below the water table."></svg></div>
        <div class="g-side">
          <div class="controls">
            <div class="range"><label for="gc-wt">Water table</label><input type="range" id="gc-wt" min="-10" max="3" step="0.25" value="-4"><output id="gc-wt-o">4.0 m down</output></div>
          </div>
          <div class="readouts">
            <div class="ro"><span>Total stress <i class="g-sym">σ</i></span><b id="gc-s">192 kPa</b><small>at 10 m depth</small></div>
            <div class="ro"><span>Pore pressure <i class="g-sym">u</i></span><b id="gc-u">59 kPa</b><small id="gc-u2">at 10 m depth</small></div>
            <div class="ro"><span>Effective stress <i class="g-sym">σ′</i></span><b id="gc-e">133 kPa</b><small>σ − u</small></div>
            <div class="ro"><span>Strength left</span><b id="gc-str">74%</b><small>compared with dry sand</small></div>
          </div>
          <div class="legend g-legend">
            <span><i class="g-l-tot"></i>Total stress σ</span>
            <span><i class="g-l-u"></i>Pore pressure u</span>
            <span><i class="g-l-eff"></i>Effective stress σ′</span>
          </div>
        </div>
      </div>
      <figcaption>Drag the water table up to the ground, then above it. The space between the black and blue lines is the effective stress, the press the grains still have. The soil gets <strong>heavier</strong> as it soaks, yet <strong>weaker</strong>, because the pore pressure rises faster than the weight.</figcaption>
    </figure>
