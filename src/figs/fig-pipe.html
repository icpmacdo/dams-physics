<figure class="sheet wide" id="fig-pipe">
      <div class="sheet-top">
        <span class="figno"><b>Fig. 8.3</b> · Backward erosion piping, from boil to breach</span>
        <span class="scale-note">Schematic · hours to days compressed</span>
      </div>
      <p class="swipe-hint">Drawing scrolls sideways →</p>
      <div class="controls">
        <button class="btn primary" id="pp-play" type="button"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2,1 L11,6 L2,11 z"/></svg><span>Play</span></button>
        <div class="range" style="flex:2 1 280px"><label for="pp-t">Progress</label><input type="range" id="pp-t" min="0" max="5" step="0.01" value="0"><output class="stage-label" id="pp-stage">1 · Steady seepage</output></div>
        <div class="ctl"><span>Toe</span><div class="seg" id="pp-filter"><button type="button" data-v="0" aria-pressed="true">Unprotected</button><button type="button" data-v="1" aria-pressed="false">Filter + weighting berm</button></div></div>
      </div>
      <div class="svgwrap"><svg class="dwg" id="svg-pipe" viewBox="0 0 1000 330" role="img" aria-label="Animated sequence: seepage under a dam on sand exits at the toe, forms a sand boil, a pipe erodes backward under the dam to the reservoir, enlarges, and the dam breaches. With a filter at the toe, the process stops at the first stage."></svg></div>
      <figcaption>Each stage feeds the next: a shorter seepage path means a steeper gradient, which means faster erosion. With a <strong>filter and weighting berm</strong> at the toe, the water still comes out, but the sand can't, so the chain never starts. Inspectors watch for boils, cloudy (turbid) seepage and sinkholes for exactly this reason.</figcaption>
    </figure>
