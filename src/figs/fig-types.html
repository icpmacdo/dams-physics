<figure class="sheet wide" id="fig-types">
      <div class="sheet-top">
        <span class="figno"><b>Fig. 5.1</b> · Water dam and tailings dam in section</span>
        <span class="scale-note">Schematic · not to scale</span>
      </div>
      <div class="pair">
        <div>
          <p class="panel-title">Concrete gravity dam with powerhouse <small>hydroelectric</small></p>
          <div class="svgwrap"><svg class="dwg" id="svg-hydro" viewBox="0 0 560 340" role="img" aria-label="A concrete gravity dam holding a reservoir. Water enters an intake, drops through a penstock to a turbine in the powerhouse at the toe, and leaves through the tailrace. Water pressure on the upstream face grows with depth."></svg></div>
          <div class="controls">
            <div class="range"><label for="hy-level">Reservoir level</label><input type="range" id="hy-level" min="0" max="100" value="80"><output id="hy-level-o">H = 86 m</output></div>
            <div class="range"><label for="hy-flow">Turbine flow</label><input type="range" id="hy-flow" min="10" max="300" value="150"><output id="hy-flow-o">150 m³/s</output></div>
          </div>
          <div class="readouts">
            <div class="ro"><span>Power <i class="g-sym">P = ηρgQH</i></span><b id="hy-P">114 MW</b><small>η = 0.90 turbine–generator</small></div>
            <div class="ro"><span>Pressure at the heel</span><b id="hy-p">0.95 MPa</b><small id="hy-F">Water load 46 MN per metre of dam</small></div>
          </div>
        </div>
        <div>
          <p class="panel-title">Tailings storage facility <small>mine waste</small></p>
          <div class="svgwrap"><svg class="dwg" id="svg-tail" viewBox="0 0 560 340" role="img" aria-label="A tailings dam. Slurry from the mill is discharged from spigots on the crest. Coarse sand settles first, forming a beach; fine slimes travel on to the pond at the back. A barge reclaims pond water for the mill."></svg></div>
          <p class="note" style="margin-top:10px">Watch the grains: coarse sand drops out near the spigots and builds the beach; fines ride the water to the pond. That sorting decides how strong and how wet the deposit is near the dam.</p>
        </div>
      </div>
      <figcaption><strong>Left:</strong> head <em>H</em> drives both the turbines and the load on the dam. Drag the sliders to change the power output and the water pressure on the heel. <strong>Right:</strong> the tailings deposit is the dam's main load, and much of the dam is eventually built on top of it or out of it.</figcaption>
    </figure>
