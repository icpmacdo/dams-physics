<figure class="sheet wide" id="fig-paths">
      <div class="sheet-top">
        <span class="figno"><b>Fig. 8.1</b> · The five main seepage paths</span>
        <span class="scale-note">Schematic</span>
      </div>
      <p class="swipe-hint">Drawing scrolls sideways →</p>
      <div class="pair" style="grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)">
        <div><div class="svgwrap"><svg class="dwg" id="svg-paths" viewBox="0 0 720 340" role="img" aria-label="Section through an embankment dam on alluvium over fractured rock, with animated seepage along four paths: through the embankment, under it through the alluvium, deep through rock joints beneath the grout curtain, and along the outside of the outlet conduit."></svg></div></div>
        <div><div class="svgwrap"><svg class="dwg" id="svg-plan" viewBox="0 0 300 340" role="img" aria-label="Plan view of the dam across a valley. Seepage flows around both ends of the dam through the abutment hillsides."></svg></div></div>
      </div>
      <figcaption><strong>1 Through the embankment:</strong> slowed by the core, collected by the chimney drain. <strong>2 Under it:</strong> through pervious alluvium, rising at the toe where it can boil sand. <strong>3 Through rock:</strong> along open joints below the grout curtain. <strong>4 Along the conduit:</strong> the poorly compacted contact around a pipe or culvert is a classic concentrated leak. <strong>5 Around the abutments:</strong> through the valley sides, best seen in plan.</figcaption>
    </figure>
