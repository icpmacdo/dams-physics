<figure class="sheet wide g-fig" id="fig-depth">
      <div class="sheet-top">
        <span class="figno"><b>Fig. 2.1</b> · Water pressure on a dam face</span>
        <span class="scale-note">Depths to scale · dam shape schematic</span>
      </div>
      <div class="g-split">
        <div class="g-draw"><svg class="dwg gd" id="svg-depth" viewBox="0 0 480 390" role="img" aria-label="A reservoir held by a concrete dam. A pressure sensor hangs in the water on a cable. Arrows on the dam face show water pressure growing in a straight line from zero at the surface to its largest value at the bottom, forming a triangle."></svg></div>
        <div class="g-side">
          <div class="controls">
            <div class="range"><label for="dp-H">Water depth</label><input type="range" id="dp-H" min="5" max="100" step="1" value="50"><output id="dp-H-o">50 m</output></div>
            <div class="range"><label for="dp-h">Sensor depth</label><input type="range" id="dp-h" min="0" max="50" step="0.5" value="30"><output id="dp-h-o">30.0 m</output></div>
          </div>
          <div class="readouts">
            <div class="ro"><span>Pressure at the sensor</span><b id="dp-p">294 kPa</b><small id="dp-p2">9.81 × 30.0 m</small></div>
            <div class="ro"><span>At the foot of the dam</span><b id="dp-pb">491 kPa</b><small id="dp-pb2">9.81 × 50 m</small></div>
            <div class="ro"><span>Push on each metre of dam</span><b id="dp-F">12.3 MN</b><small id="dp-F2">as heavy as 1,250 tonnes</small></div>
          </div>
          <svg class="dwg gd g-chart" id="svg-depth-chart" viewBox="0 0 300 200" role="img" aria-label="Chart of total push on the dam against water depth. The curve bends upward: half the depth gives a quarter of the push."></svg>
        </div>
      </div>
      <figcaption>The pressure grows in a straight line with depth, so the arrows on the dam face form a triangle, from nothing at the surface to the most at the bottom. The total push is the area of that triangle. The chart shows what that means: <strong>double the depth and the push grows four times</strong>.</figcaption>
    </figure>
